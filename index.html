<head>

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@300;400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Serif+Oriya:wght@500;600;700&family=Yatra+One&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   ODIA CALENDAR 2027 — design system
   Palette grounded in Jagannath / Konark / Pattachitra:
   sindoor vermillion · haldi turmeric · indigo night ·
   palm-leaf parchment · deula maroon · Pattachitra leaf-green
   ============================================================ */
:root{
  color-scheme: light dark;
  --sindoor:#C1272D;      /* Jagannath red — primary */
  --sindoor-deep:#8E1B20;
  --haldi:#E8A00D;        /* turmeric gold — accent */
  --haldi-soft:#F4C038;
  --indigo:#1C2A4A;       /* night / depth */
  --leaf:#3E6B48;         /* Pattachitra green — tertiary */
  --maroon:#6B2016;       /* deula maroon */
  --ink:#2A1710;          /* warm dark brown text */
  --ink-soft:#5b4638;
  --paper:#F5E9CE;        /* palm-leaf parchment */
  --paper-2:#EFE0BE;      /* card / panel */
  --paper-3:#E7D3A8;      /* deeper parchment lines */
  --white-besha:#FBF4E2;  /* Balabhadra white */
  --line:#D8BE8C;
  --shadow: 22px 22px 0 -18px rgba(107,32,22,.20);

  --bg:var(--paper);
  --surface:var(--white-besha);
  --surface-2:var(--paper-2);
  --text:var(--ink);
  --text-soft:var(--ink-soft);
  --border:var(--line);
  --hair:rgba(107,32,22,.16);

  --f-display:"Yatra One", "Noto Serif Oriya", serif;
  --f-serif:"Marcellus", "Noto Serif Oriya", serif;
  --f-body:"Mukta", "Noto Sans Oriya", system-ui, sans-serif;
  --f-odia:"Noto Sans Oriya", "Mukta", sans-serif;
  --f-odia-serif:"Noto Serif Oriya", "Marcellus", serif;

  --pad-top: env(safe-area-inset-top, 0px);
  --pad-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing:border-box;
  padding-top:var(--pad-top);
  padding-bottom:var(--pad-bottom);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#12131C; --surface:#1B1D2B; --surface-2:#20233A;
    --text:#F1E4C6; --text-soft:#c3b493; --border:#3a3c58; --hair:rgba(241,228,198,.12);
    --paper-3:#2a2d47; --line:#3a3c58;
    --shadow: 22px 22px 0 -18px rgba(0,0,0,.5);
    --sindoor:#E24A4F; --sindoor-deep:#C1272D; --haldi:#F4C038;
  }
}
:root[data-theme="dark"]{
  --bg:#12131C; --surface:#1B1D2B; --surface-2:#20233A;
  --text:#F1E4C6; --text-soft:#c3b493; --border:#3a3c58; --hair:rgba(241,228,198,.12);
  --paper-3:#2a2d47; --line:#3a3c58;
  --shadow: 22px 22px 0 -18px rgba(0,0,0,.5);
  --sindoor:#E24A4F; --sindoor-deep:#C1272D; --haldi:#F4C038;
}
*,*::before,*::after{box-sizing:inherit}
html{ -webkit-text-size-adjust:100%; scroll-padding-top: calc(var(--pad-top) + 64px); }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--f-body); font-weight:400; line-height:1.55;
  font-size:16px; letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 12% -5%, rgba(232,160,13,.10), transparent 40%),
    radial-gradient(circle at 92% 0%, rgba(193,39,45,.09), transparent 42%);
  background-attachment:fixed;
}
.lang-or{ font-family:var(--f-odia); }
h1,h2,h3{ font-weight:400; line-height:1.12; }
button{ font-family:inherit; cursor:pointer; color:inherit; }
:focus-visible{ outline:3px solid var(--haldi); outline-offset:2px; border-radius:3px; }
a{ color:var(--sindoor); }

/* ---------- layout shell ---------- */
.wrap{ max-width:1180px; margin:0 auto; padding:0 clamp(14px,3vw,30px) 64px; }

/* ---------- masthead (the hero) ---------- */
.masthead{ position:relative; overflow:hidden; color:var(--white-besha);
  background:
    linear-gradient(160deg, var(--maroon), var(--sindoor-deep) 55%, var(--sindoor));
  border-bottom:5px solid var(--haldi);
}
.masthead::after{ /* Pattachitra dotted border band */
  content:""; position:absolute; left:0; right:0; bottom:0; height:5px;
  background:repeating-linear-gradient(90deg, var(--indigo) 0 10px, transparent 10px 20px);
  opacity:.5;
}
.masthead-inner{ max-width:1180px; margin:0 auto; padding:clamp(18px,3vw,30px) clamp(14px,3vw,30px) clamp(20px,3vw,32px);
  display:grid; grid-template-columns:1fr auto; gap:22px; align-items:center; position:relative; z-index:2; }
.brand{ display:flex; align-items:center; gap:18px; min-width:0; }
.netra-wheel{ flex:0 0 auto; width:clamp(64px,10vw,92px); height:clamp(64px,10vw,92px); }
.wheel-spin{ transform-origin:50% 50%; animation:spin 60s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce){ .wheel-spin{ animation:none; } }
.brand-text{ min-width:0; }
.brand-kicker{ font-family:var(--f-body); font-size:.72rem; font-weight:600;
  letter-spacing:.32em; text-transform:uppercase; color:var(--haldi-soft); margin:0 0 2px; }
.brand-title{ font-family:var(--f-display); font-size:clamp(2rem,6vw,3.5rem); margin:0; line-height:.92;
  text-shadow:2px 3px 0 rgba(0,0,0,.18); }
.brand-title .yr{ color:var(--haldi-soft); }
.brand-sub{ font-family:var(--f-odia-serif); font-size:clamp(1rem,2.6vw,1.5rem); margin:4px 0 0; color:#fff; opacity:.96; }
.masthead-controls{ display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.pill-group{ display:inline-flex; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.28);
  border-radius:999px; padding:3px; }
.pill-group button{ border:0; background:transparent; color:#fff; padding:6px 14px; border-radius:999px;
  font-size:.85rem; font-weight:600; letter-spacing:.02em; opacity:.8; }
.pill-group button.on{ background:var(--haldi); color:var(--maroon); opacity:1; }
.icon-btn{ background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.28); color:#fff;
  width:40px; height:40px; border-radius:50%; font-size:1.1rem; display:grid; place-items:center; }

/* ---------- today band ---------- */
.today-band{ background:var(--indigo); color:var(--white-besha); }
.today-inner{ max-width:1180px; margin:0 auto; padding:14px clamp(14px,3vw,30px);
  display:flex; flex-wrap:wrap; gap:10px 26px; align-items:center; }
.today-tag{ font-size:.72rem; font-weight:700; letter-spacing:.28em; text-transform:uppercase;
  color:var(--haldi-soft); }
.today-greg{ font-family:var(--f-serif); font-size:1.15rem; }
.today-odia{ font-family:var(--f-odia-serif); font-size:1.15rem; color:var(--haldi-soft); }
.today-dot{ opacity:.4; }
.today-up{ margin-left:auto; display:flex; align-items:center; gap:9px; font-size:.95rem;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); padding:6px 14px; border-radius:999px; }
.today-up b{ color:var(--haldi-soft); font-weight:600; }

/* ---------- toolbar ---------- */
.toolbar{ position:sticky; top:var(--pad-top); z-index:30; background:var(--surface);
  border-bottom:1px solid var(--border); box-shadow:0 6px 18px -14px rgba(0,0,0,.4); }
.toolbar-inner{ max-width:1180px; margin:0 auto; padding:10px clamp(14px,3vw,30px);
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.views{ display:inline-flex; border:1.5px solid var(--sindoor); border-radius:10px; overflow:hidden; }
.views button{ border:0; background:transparent; color:var(--sindoor); padding:8px 15px; font-weight:600;
  font-size:.92rem; display:flex; align-items:center; gap:6px; }
.views button.on{ background:var(--sindoor); color:#fff; }
.nav-group{ display:inline-flex; align-items:center; gap:6px; }
.nav-group .arrow{ width:36px; height:36px; border-radius:9px; border:1.5px solid var(--border);
  background:var(--surface-2); font-size:1.1rem; display:grid; place-items:center; }
.nav-group .arrow:hover{ border-color:var(--sindoor); color:var(--sindoor); }
.period{ font-family:var(--f-serif); font-size:1.15rem; min-width:9.5ch; text-align:center; }
.period small{ display:block; font-family:var(--f-odia-serif); font-size:.8rem; color:var(--text-soft); }
.spacer{ flex:1 1 auto; }
.search{ position:relative; }
.search input{ font-family:inherit; font-size:.92rem; padding:9px 14px 9px 34px; border-radius:10px;
  border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); width:min(240px,52vw); }
.search input:focus{ border-color:var(--sindoor); outline:none; }
.search .mag{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.5; }
.tool-btn{ border:1.5px solid var(--border); background:var(--surface-2); border-radius:10px;
  padding:8px 13px; font-weight:600; font-size:.9rem; display:inline-flex; align-items:center; gap:7px; }
.tool-btn:hover{ border-color:var(--haldi); }

/* ---------- section headings ---------- */
.sec-head{ display:flex; align-items:baseline; gap:14px; margin:26px 2px 14px; }
.sec-head h2{ font-family:var(--f-serif); font-size:1.5rem; margin:0; }
.sec-head .rule{ flex:1; height:2px; background:
  repeating-linear-gradient(90deg,var(--haldi) 0 6px, transparent 6px 12px); opacity:.6; }

/* ---------- month grid ---------- */
.cal-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px;
  box-shadow:var(--shadow); overflow:hidden; }
.weekdays{ display:grid; grid-template-columns:repeat(7,1fr); background:var(--indigo); color:var(--white-besha); }
.weekdays div{ padding:9px 4px; text-align:center; font-size:.78rem; font-weight:600; letter-spacing:.08em; }
.weekdays div.sun{ color:var(--haldi-soft); }
.grid{ display:grid; grid-template-columns:repeat(7,1fr); }
.cell{ min-height:clamp(74px,12vw,116px); border-right:1px solid var(--hair); border-bottom:1px solid var(--hair);
  padding:5px 6px; position:relative; display:flex; flex-direction:column; gap:3px; background:var(--surface);
  text-align:left; align-items:stretch; width:100%; border-top:0; border-left:0; }
.cell:nth-child(7n){ border-right:0; }
.cell.blank{ background:repeating-linear-gradient(135deg,transparent 0 7px, var(--hair) 7px 8px); opacity:.5; }
.cell.sunday{ background:linear-gradient(var(--surface),var(--surface)) padding-box; }
.cell.govt::after{ content:""; position:absolute; inset:0; background:var(--haldi); opacity:.07; pointer-events:none; }
.cell.holiday::after{ content:""; position:absolute; inset:0; background:var(--sindoor); opacity:.09; pointer-events:none; }
.cell.today{ box-shadow:inset 0 0 0 3px var(--sindoor); z-index:2; }
.cell:hover{ background:var(--surface-2); }
.cell .g-num{ font-family:var(--f-serif); font-size:clamp(1rem,2.5vw,1.3rem); line-height:1; }
.cell.sunday .g-num,.cell .g-num.sun{ color:var(--sindoor); }
.cell .o-num{ position:absolute; top:5px; right:7px; font-family:var(--f-odia); font-size:.7rem;
  color:var(--text-soft); }
.chips{ margin-top:auto; display:flex; flex-direction:column; gap:2px; }
.chip{ font-size:.68rem; line-height:1.2; padding:2px 6px; border-radius:5px; color:#fff;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:4px; border:0; width:100%; }
.chip .ic{ font-size:.78rem; }
.chip.more{ background:transparent; color:var(--text-soft); font-weight:600; padding-left:2px; }
.cat-jagannath{ background:var(--sindoor); }
.cat-state{ background:var(--haldi); color:var(--maroon); }
.cat-national{ background:var(--indigo); }
.cat-hindu{ background:var(--leaf); }
.cat-seasonal{ background:var(--maroon); }
.cat-faith{ background:#5a4a86; }
.cat-observance{ background:#8a7a5c; }

/* ---------- legend ---------- */
.legend{ display:flex; flex-wrap:wrap; gap:8px 16px; margin:14px 4px 0; font-size:.82rem; color:var(--text-soft); }
.legend span{ display:inline-flex; align-items:center; gap:6px; }
.legend i{ width:13px; height:13px; border-radius:4px; display:inline-block; }

/* ---------- year view ---------- */
.year-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
.mini{ background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:12px; box-shadow:var(--shadow); }
.mini h3{ font-family:var(--f-serif); font-size:1.1rem; margin:0 0 2px; color:var(--sindoor); cursor:pointer; }
.mini h3 small{ font-family:var(--f-odia-serif); color:var(--text-soft); font-size:.72rem; margin-left:6px; }
.mini-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; margin-top:6px; }
.mini-grid .h{ font-size:.6rem; text-align:center; color:var(--text-soft); padding:2px 0; }
.mini-grid .h.sun{ color:var(--sindoor); }
.mini-day{ aspect-ratio:1; display:grid; place-items:center; font-size:.72rem; border-radius:5px; position:relative; }
.mini-day.fest{ font-weight:700; }
.mini-day.hol{ background:var(--sindoor); color:#fff; }
.mini-day.festd{ box-shadow:inset 0 0 0 1.5px var(--haldi); }
.mini-day.today{ box-shadow:inset 0 0 0 2px var(--indigo); }
.mini-day.sun{ color:var(--sindoor); }

/* ---------- festival list view ---------- */
.filters{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 2px 18px; }
.filters button{ border:1.5px solid var(--border); background:var(--surface); border-radius:999px;
  padding:6px 14px; font-size:.86rem; font-weight:600; color:var(--text-soft); }
.filters button.on{ background:var(--indigo); color:#fff; border-color:var(--indigo); }
.fest-list{ display:grid; gap:12px; }
.fest-row{ display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  background:var(--surface); border:1px solid var(--border); border-left-width:6px; border-radius:13px;
  padding:14px 18px; text-align:left; width:100%; box-shadow:var(--shadow); transition:transform .12s ease; }
.fest-row:hover{ transform:translateX(3px); }
.fest-date{ text-align:center; min-width:58px; }
.fest-date .d{ font-family:var(--f-serif); font-size:1.7rem; line-height:1; }
.fest-date .m{ font-size:.74rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--sindoor); }
.fest-date .w{ font-size:.68rem; color:var(--text-soft); }
.fest-main .nm{ font-family:var(--f-serif); font-size:1.2rem; }
.fest-main .nm.lang-or{ font-family:var(--f-odia-serif); }
.fest-main .od{ font-family:var(--f-odia); color:var(--text-soft); font-size:.92rem; }
.fest-main .sig{ font-size:.88rem; color:var(--text-soft); margin-top:3px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.fest-tags{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.tag{ font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff; white-space:nowrap; }
.tag.holiday{ background:var(--sindoor); }
.tag.cat{ opacity:.9; }
.fest-emoji{ font-size:1.6rem; }
.empty{ text-align:center; padding:50px 20px; color:var(--text-soft); }
.empty .big{ font-size:2.4rem; }

/* ---------- modal ---------- */
.modal-bg{ position:fixed; inset:0; background:rgba(20,10,6,.55); backdrop-filter:blur(3px);
  display:grid; place-items:center; padding:16px; z-index:60; }
.modal{ background:var(--surface); border:1px solid var(--border); border-radius:18px;
  max-width:560px; width:100%; max-height:88vh; overflow:auto; box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  border-top:6px solid var(--sindoor); }
.modal-head{ padding:22px 24px 16px; position:relative; }
.modal-head .close{ position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:50%;
  border:1.5px solid var(--border); background:var(--surface-2); font-size:1.1rem; }
.modal-emoji{ font-size:2.2rem; }
.modal-head h2{ font-family:var(--f-serif); font-size:1.6rem; margin:6px 0 2px; padding-right:40px; }
.modal-head h2.lang-or{ font-family:var(--f-odia-serif); }
.modal-head .alt{ font-family:var(--f-odia-serif); color:var(--sindoor); font-size:1.15rem; }
.modal-meta{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px; }
.meta-box{ background:var(--surface-2); border:1px solid var(--hair); border-radius:10px; padding:8px 12px; flex:1 1 120px; }
.meta-box .k{ font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-soft); }
.meta-box .v{ font-family:var(--f-serif); font-size:1.02rem; }
.meta-box .v.od{ font-family:var(--f-odia-serif); }
.modal-body{ padding:4px 24px 24px; }
.modal-body h4{ font-family:var(--f-body); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--sindoor); margin:18px 0 6px; }
.modal-body p{ margin:0; font-size:.98rem; line-height:1.6; }
.modal-body p.lang-or{ font-family:var(--f-odia); line-height:1.75; }

/* ---------- tooltip ---------- */
[data-tip]{ position:relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after{
  content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
  background:var(--indigo); color:#fff; padding:6px 10px; border-radius:7px; font-size:.74rem; white-space:nowrap;
  z-index:50; box-shadow:0 6px 16px rgba(0,0,0,.3); pointer-events:none; max-width:220px; white-space:normal; width:max-content; }

/* ---------- footer ---------- */
.foot{ margin-top:40px; padding:26px 0 10px; border-top:2px solid var(--hair); color:var(--text-soft); font-size:.85rem; }
.foot .konark{ text-align:center; margin-bottom:14px; opacity:.8; }
.foot p{ margin:5px 0; }

/* ---------- responsive ---------- */
@media (max-width:720px){
  .masthead-inner{ grid-template-columns:1fr; }
  .masthead-controls{ align-items:flex-start; flex-direction:row; flex-wrap:wrap; }
  .today-up{ margin-left:0; width:100%; }
  .cell .o-num{ display:none; }
  .cell{ min-height:64px; }
  .chip .lbl{ display:none; }
  .chip{ width:auto; align-self:flex-start; padding:2px 5px; }
  .fest-row{ grid-template-columns:auto 1fr; }
  .fest-tags{ grid-column:1 / -1; flex-direction:row; align-items:center; }
  .fest-emoji{ display:none; }
  .period{ min-width:auto; }
}
@media (max-width:420px){
  .weekdays div{ font-size:.66rem; padding:7px 2px; }
}

/* ---------- print / PDF ---------- */
@media print{
  :root{ --bg:#fff; --surface:#fff; --surface-2:#fff; --text:#000; --border:#999; --hair:#ccc; }
  body{ background:#fff; }
  .toolbar,.masthead-controls,.today-up,.no-print,.icon-btn,.foot .no-print{ display:none !important; }
  .masthead{ color:#000; background:#fff; border-bottom:2px solid #000; }
  .brand-title{ color:#000; text-shadow:none; }
  .brand-title .yr, .brand-sub{ color:#000; }
  .today-band{ background:#fff; color:#000; border-bottom:1px solid #000; }
  .today-odia,.today-tag{ color:#000; }
  .cal-card,.mini,.fest-row{ box-shadow:none; break-inside:avoid; }
  .weekdays{ background:#eee; color:#000; }
  .chip{ color:#000 !important; background:#fff !important; border:1px solid #999 !important; }
  .year-grid{ grid-template-columns:repeat(3,1fr); }
  .wrap{ padding-bottom:0; }
  @page{ margin:12mm; }
}
</style>
</head>
<body>
<div id="root" role="application" aria-label="Odia Calendar 2027"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This interactive Odia Calendar needs JavaScript enabled to display festivals and dates.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>

/* ============================================================
   1.  ODIA SOLAR (PANJI) CALENDAR ENGINE
   The Odia civil calendar is solar: each month begins on a
   Sankranti (the Sun's sidereal ingress). Given the 12 Sankranti
   dates, every Gregorian day maps to an Odia solar month + day.
   2027 Sankranti dates verified against panchang sources.
   ============================================================ */
const ODIA_MONTHS = [
  {en:"Baisakha",   or:"ବୈଶାଖ"},   {en:"Jyeshtha",  or:"ଜ୍ୟେଷ୍ଠ"},
  {en:"Ashadha",    or:"ଆଷାଢ଼"},    {en:"Shrabana",  or:"ଶ୍ରାବଣ"},
  {en:"Bhadraba",   or:"ଭାଦ୍ରବ"},   {en:"Aswina",    or:"ଆଶ୍ୱିନ"},
  {en:"Kartika",    or:"କାର୍ତ୍ତିକ"}, {en:"Margasira", or:"ମାର୍ଗଶିର"},
  {en:"Pausa",      or:"ପୌଷ"},      {en:"Magha",     or:"ମାଘ"},
  {en:"Phalguna",   or:"ଫାଲ୍ଗୁନ"},  {en:"Chaitra",   or:"ଚୈତ୍ର"}
];
// {date: [Y,M(1-12),D], m: index into ODIA_MONTHS}
const SANKRANTI = [
  {d:[2026,8,17],  m:4}, {d:[2026,9,17],  m:5}, {d:[2026,10,17], m:6},
  {d:[2026,11,16], m:7}, {d:[2026,12,16], m:8}, {d:[2027,1,14],  m:9},
  {d:[2027,2,13],  m:10},{d:[2027,3,15],  m:11},{d:[2027,4,14],  m:0},
  {d:[2027,5,15],  m:1}, {d:[2027,6,15],  m:2}, {d:[2027,7,17],  m:3},
  {d:[2027,8,17],  m:4}, {d:[2027,9,17],  m:5}, {d:[2027,10,18], m:6},
  {d:[2027,11,17], m:7}, {d:[2027,12,16], m:8}
];
const dayNum = (y,m,d)=> Math.floor(Date.UTC(y,m-1,d)/86400000);
const SANK = SANKRANTI.map(s=>({n:dayNum(s.d[0],s.d[1],s.d[2]), m:s.m})).sort((a,b)=>a.n-b.n);
const OD = "୦୧୨୩୪୫୬୭୮୯";
const toOdiaDigits = (s)=> String(s).replace(/[0-9]/g,c=>OD[+c]);
const num = (n,lang)=> lang==="or" ? toOdiaDigits(n) : String(n);

// Vilayati Sana (Odia era) rolls over on Kanya Sankranti (~17 Sep)
function vilayati(n){
  if(n >= dayNum(2027,9,17)) return 1435;
  if(n >= dayNum(2026,9,17)) return 1434;
  return 1433;
}
function odiaDate(dateObj){
  const n = dayNum(dateObj.getFullYear(), dateObj.getMonth()+1, dateObj.getDate());
  let anchor = null;
  for(const s of SANK){ if(s.n <= n) anchor = s; else break; }
  if(!anchor) return null;
  const day = n - anchor.n + 1;
  return { month: ODIA_MONTHS[anchor.m], day, sala: vilayati(n) };
}

 {date:"2027-06-04",cat:"hindu",hol:false,ic:"🪷",en:"Savitri Amavasya (Sabitri Brata)",or:"ସାବିତ୍ରୀ ଅମାବାସ୍ୟା",

 {date:"2027-06-14",cat:"state",hol:false,ic:"🌱",en:"Pahili Raja",or:"ପହିଲି ରଜ",

 {date:"2027-06-15",cat:"state",hol:true,ic:"🌸",en:"Raja Sankranti (Raja Parba)",or:"ରଜ ସଂକ୍ରାନ୍ତି / ରଜ ପର୍ବ",

  trEn:"Continued swinging and feasting; ritual bath of the grinding stone worshipped as Bhumi.",

 {date:"2027-06-16",cat:"faith",hol:true,ic:"🕌",en:"Muharram",or:"ମହରମ୍",

 {date:"2027-06-18",cat:"jagannath",hol:false,ic:"🛁",en:"Snana Yatra (Deba Snana Purnima)",or:"ସ୍ନାନ ଯାତ୍ରା",

 {date:"2027-07-05",cat:"jagannath",hol:true,ic:"🛕",en:"Ratha Yatra (Car Festival)",or:"ରଥଯାତ୍ରା",

 {date:"2027-08-15",cat:"national",hol:true,ic:"🇮🇳",en:"Independence Day",or:"ସ୍ୱାଧୀନତା ଦିବସ",

 {date:"2027-08-17",cat:"hindu",hol:false,ic:"🪢",en:"Jhulan / Gamha Purnima & Rakhi",or:"ଝୁଲଣ / ଗହ୍ମା ପୂର୍ଣ୍ଣିମା ଓ ରାଖୀ",

 {date:"2027-08-25",cat:"hindu",hol:true,ic:"🦚",en:"Krishna Janmashtami",or:"ଜନ୍ମାଷ୍ଟମୀ",

 {date:"2027-09-04",cat:"hindu",hol:false,ic:"🐘",en:"Ganesh Chaturthi",or:"ଗଣେଶ ଚତୁର୍ଥୀ",

 {date:"2027-09-30",cat:"observance",hol:false,ic:"🪔",en:"Mahalaya (Sarad Navratri begins)",or:"ମହାଳୟା",

/* ============================================================
   4.  HELPERS
   ============================================================ */
const pad = n => String(n).padStart(2,"0");
const isoOf = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;              // m: 0-based
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const todayObj = new Date();
const TODAY_ISO = isoOf(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate());

function govtHoliday(dateObj){                 // Sundays + 2nd & 4th Saturdays
  const wd = dateObj.getDay();
  if(wd===0) return "sun";
  if(wd===6){ const wk = Math.floor((dateObj.getDate()-1)/7)+1; if(wk===2||wk===4) return "sat"; }
  return null;
}
const store = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:v; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const catClass = c => CATS[c].cls;
const FEST_SORTED = [...FESTIVALS].sort((a,b)=> a.date<b.date?-1:1);

/* ============================================================
   5.  BRAND MARK — Konark wheel (the one bold element)
   ============================================================ */
function KonarkWheel({size=88, spin=true}){
  const spokes=[];
  for(let i=0;i<16;i++){ const a=(i*22.5)*Math.PI/180;
    spokes.push(React.createElement("line",{key:i,x1:50+14*Math.cos(a),y1:50+14*Math.sin(a),
      x2:50+40*Math.cos(a),y2:50+40*Math.sin(a),stroke:"currentColor",strokeWidth:i%2?1.4:3,strokeLinecap:"round"}));
  }
  const beads=[];
  for(let i=0;i<24;i++){ const a=(i*15)*Math.PI/180; beads.push(React.createElement("circle",{key:"b"+i,cx:50+46*Math.cos(a),cy:50+46*Math.sin(a),r:1.7,fill:"currentColor"})); }
  return React.createElement("svg",{className:"netra-wheel",viewBox:"0 0 100 100","aria-hidden":"true",style:{width:size,height:size,color:"var(--haldi-soft)"}},
    React.createElement("g",{className:spin?"wheel-spin":""},
      React.createElement("circle",{cx:50,cy:50,r:48,fill:"none",stroke:"currentColor",strokeWidth:2.5}),
      React.createElement("circle",{cx:50,cy:50,r:42,fill:"none",stroke:"currentColor",strokeWidth:1.5}),
      ...beads, ...spokes,
      React.createElement("circle",{cx:50,cy:50,r:13,fill:"none",stroke:"currentColor",strokeWidth:3}),
      React.createElement("circle",{cx:50,cy:50,r:4,fill:"currentColor"})
    )
  );
}

function TodayBand({lang,t,onOpen}){
  const od = odiaDate(todayObj);
  const wd = (lang==="or"?WEEKFULL_OR:WEEKFULL_EN)[todayObj.getDay()];
  const gd = `${(lang==="or"?WEEKFULL_OR:WEEKFULL_EN)[todayObj.getDay()]}, ${num(todayObj.getDate(),lang)} ${(lang==="or"?GMON_OR:GMON_EN)[todayObj.getMonth()]} ${num(todayObj.getFullYear(),lang)}`;
  const upcoming = FEST_SORTED.find(f=> f.date >= TODAY_ISO) || FEST_SORTED[0];
  const upObj = parseISO(upcoming.date);
  const days = Math.round((upObj - new Date(todayObj.getFullYear(),todayObj.getMonth(),todayObj.getDate()))/86400000);
  return (
  <div className="today-band">
    <div className="today-inner">
      <span className="today-tag">{t.today}</span>
      <span className={"today-greg"+(lang==="or"?" lang-or":"")}>{gd}</span>
      <span className="today-dot">◆</span>
      {od && <span className="today-odia">{od.month[lang]} {num(od.day,lang)}, {t.sala} {num(od.sala,lang)}</span>}
      <button className="today-up" onClick={()=>onOpen(upcoming)} aria-label={t.upcoming+": "+upcoming[lang]}>
        <span className="ic">{upcoming.ic}</span>
        <span>{t.upcoming}: <b className={lang==="or"?"lang-or":""}>{upcoming[lang]}</b> · {days>0?(num(days,lang)+(lang==="or"?" ଦିନ":" days")):(lang==="or"?"ଆଜି":"today")}</span>
      </button>
    </div>
  </div>);
}

function Toolbar({view,setView,lang,month,setMonth,year,setYear,search,setSearch,t,onPrint,onPdf}){
  const prev=()=>{ if(month===0){setMonth(11);setYear(year-1);} else setMonth(month-1); };
  const next=()=>{ if(month===11){setMonth(0);setYear(year+1);} else setMonth(month+1); };
  return (
  <div className="toolbar no-print">
    <div className="toolbar-inner">
      <div className="views" role="tablist" aria-label="Views">
        <button role="tab" aria-selected={view==="month"} className={view==="month"?"on":""} onClick={()=>setView("month")}>🗓️ <span>{t.month}</span></button>
        <button role="tab" aria-selected={view==="year"} className={view==="year"?"on":""} onClick={()=>setView("year")}>📅 <span>{t.year}</span></button>
        <button role="tab" aria-selected={view==="festival"} className={view==="festival"?"on":""} onClick={()=>setView("festival")}>🎉 <span>{t.festivals}</span></button>
      </div>
      {view==="month" && (
        <div className="nav-group">
          <button className="arrow" onClick={prev} aria-label="Previous month">‹</button>
          <div className="period">{(lang==="or"?GMON_OR:GMON_EN)[month]} {num(year,lang)}
            <small className={lang==="or"?"lang-or":""}>{odMonthsSpan(month,year,lang)}</small></div>
          <button className="arrow" onClick={next} aria-label="Next month">›</button>
        </div>)}
      {view==="year" && <div className="period" style={{minWidth:"auto"}}>{num(2027,lang)}</div>}
      <div className="spacer"></div>
      {view==="festival" && (
        <div className="search">
          <span className="mag" aria-hidden="true">🔍</span>
          <input type="search" value={search} onChange={e=>setSearch(e.target.value)} placeholder={t.search} aria-label={t.search}/>
        </div>)}
      <button className="tool-btn" onClick={onPrint} data-tip={t.print}>🖨️ <span>{t.print}</span></button>
      <button className="tool-btn" onClick={onPdf} data-tip="Download PDF">⬇️ <span>{t.pdf}</span></button>
    </div>
  </div>);
}
// Odia solar months spanning a Gregorian month (for the sub-label)
function odMonthsSpan(m,y,lang){
  const a=odiaDate(new Date(y,m,1)), b=odiaDate(new Date(y,m+1,0));
  if(!a||!b) return "";
  if(a.month.en===b.month.en) return a.month[lang];
  return a.month[lang]+" – "+b.month[lang];
}

  <div className="legend" aria-hidden="false">
    {items.map(([c])=> <span key={c}><i className={catClass(c)}></i>{CATS[c][lang]}</span>)}
    <span><i style={{background:"var(--haldi)",opacity:.5}}></i>{lang==="or"?"ସରକାରୀ ଛୁଟି":"Govt. holiday"}</span>
  </div>);
}

function MonthView({month,year,lang,t,onOpen}){
  const first=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++) cells.push(<div key={"b"+i} className="cell blank" aria-hidden="true"></div>);
  for(let d=1; d<=days; d++){
    const dateObj=new Date(year,month,d);
    const key=isoOf(year,month,d);
    const fests=FEST_BY_DATE[key]||[];
    const od=odiaDate(dateObj);
    const gh=govtHoliday(dateObj);
    const isHoliday=fests.some(f=>f.hol);
    const cls=["cell"];
    if(dateObj.getDay()===0) cls.push("sunday");
    if(isHoliday) cls.push("holiday"); else if(gh) cls.push("govt");
    if(key===TODAY_ISO) cls.push("today");
    cells.push(
      <div key={key} className={cls.join(" ")}>
        <span className={"g-num"+(dateObj.getDay()===0?" sun":"")}>{num(d,lang)}</span>
        {od && <span className="o-num">{od.month[lang]} {num(od.day,lang)}</span>}
        <div className="chips">
          {fests.slice(0,2).map((f,i)=>(
            <button key={i} className={"chip "+catClass(f.cat)} onClick={()=>onOpen(f)}
              data-tip={f[lang]+" · "+(f.hol?t.holiday:CATS[f.cat][lang])} aria-label={f[lang]}>
              <span className="ic" aria-hidden="true">{f.ic}</span><span className="lbl">{f[lang]}</span>
            </button>))}
          {fests.length>2 && <button className="chip more" onClick={()=>onOpen(fests[2])}>+{num(fests.length-2,lang)} {t.more}</button>}
          {fests.length===0 && gh && <span className="chip" style={{background:"transparent",color:"var(--text-soft)",fontSize:".62rem",padding:"1px 2px"}} data-tip={gh==="sun"?t.govtSun:t.govtSat}></span>}
        </div>
      </div>);
  }
  return (
  <div>
    <div className="cal-card">
      <div className="weekdays">{(lang==="or"?WEEK_OR:WEEK_EN).map((w,i)=><div key={i} className={i===0?"sun":""}>{w}</div>)}</div>
      <div className="grid">{cells}</div>
    </div>
    <Legend t={t} lang={lang}/>
  </div>);
}

function MiniMonth({month,year,lang,onOpen,onJump}){
  const first=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++) cells.push(<div key={"b"+i} className="mini-day"></div>);
  for(let d=1; d<=days; d++){
    const dateObj=new Date(year,month,d); const key=isoOf(year,month,d);
    const fests=FEST_BY_DATE[key]||[]; const isHol=fests.some(f=>f.hol);
    const cls=["mini-day"];
    if(dateObj.getDay()===0) cls.push("sun");
    if(fests.length){ cls.push("fest"); cls.push(isHol?"hol":"festd"); }
    if(key===TODAY_ISO) cls.push("today");
    cells.push(<div key={key} className={cls.join(" ")}
      onClick={fests.length?()=>onOpen(fests[0]):undefined}
      style={fests.length?{cursor:"pointer"}:undefined}
      data-tip={fests.length?fests.map(f=>f[lang]).join(" · "):undefined}>{num(d,lang)}</div>);
  }
  return (
  <div className="mini">
    <h3 onClick={()=>onJump(month)} title={GMON_EN[month]}>{(lang==="or"?GMON_OR:GMON_EN)[month]}
      <small className={lang==="or"?"lang-or":""}>{odMonthsSpan(month,year,lang)}</small></h3>
    <div className="mini-grid">
      {(lang==="or"?WEEK_OR:WEEK_EN).map((w,i)=><div key={i} className={"h"+(i===0?" sun":"")}>{w[0]}</div>)}
      {cells}
    </div>
  </div>);
}

function YearView({lang,onOpen,onJump}){
  return (
  <div>
    <div className="sec-head"><h2>{lang==="or"?T.or.allYear:"Odisha 2027 — year at a glance"}</h2><span className="rule"></span></div>
    <div className="year-grid">
      {Array.from({length:12},(_,m)=><MiniMonth key={m} month={m} year={2027} lang={lang} onOpen={onOpen} onJump={onJump}/>)}
    </div>
  </div>);
}

function FestivalView({lang,t,search,filter,setFilter,onOpen}){
  const list=useMemo(()=>{
    const q=search.trim().toLowerCase();
    return FEST_SORTED.filter(f=>{
      if(filter==="holiday" && !f.hol) return false;
      if(filter!=="all" && filter!=="holiday" && f.cat!==filter) return false;
      if(!q) return true;
      return (f.en+" "+f.or+" "+f.sigEn+" "+f.sigOr).toLowerCase().includes(q);
    });
  },[search,filter]);
  const chips=[["all",t.all],["holiday",t.holidaysOnly],...Object.keys(CATS).map(c=>[c,CATS[c][lang]])];
  return (
  <div>
    <div className="sec-head"><h2 className={lang==="or"?"lang-or":""}>{lang==="or"?T.or.allYear:"All 2027 festivals & holidays"}</h2><span className="rule"></span></div>
    <div className="filters no-print">
      {chips.map(([k,label])=><button key={k} className={filter===k?"on":""} onClick={()=>setFilter(k)}>{label}</button>)}
    </div>
    {list.length===0
      ? <div className="empty"><div className="big">🔍</div><p>{t.noResults}</p></div>
      : <div className="fest-list">
          {list.map((f,i)=>{ const dt=parseISO(f.date); const od=odiaDate(dt);
            return (
            <button key={i} className="fest-row" style={{borderLeftColor:leftColor(f.cat)}} onClick={()=>onOpen(f)}>
              <div className="fest-date">
                <div className="d">{num(dt.getDate(),lang)}</div>
                <div className="m">{(lang==="or"?GMON_OR:GMON_EN)[dt.getMonth()].slice(0,3)}</div>
                <div className="w">{(lang==="or"?WEEK_OR:WEEK_EN)[dt.getDay()]}</div>
              </div>
              <div className="fest-main">
                <div className={"nm"+(lang==="or"?" lang-or":"")}>{f[lang]}</div>
                <div className="od">{lang==="or"?f.en:f.or}{od?" · "+od.month[lang]+" "+num(od.day,lang):""}</div>
                <div className="sig">{lang==="or"?f.sigOr:f.sigEn}</div>
              </div>
              <div className="fest-tags">
                <span className="fest-emoji" aria-hidden="true">{f.ic}</span>
                {f.hol && <span className="tag holiday">{t.holiday}</span>}
                <span className="tag cat" style={{background:leftColor(f.cat)}}>{CATS[f.cat][lang]}</span>
              </div>
            </button>);
          })}
        </div>}
  </div>);
}
function leftColor(c){ return {jagannath:"var(--sindoor)",state:"var(--haldi)",national:"var(--indigo)",hindu:"var(--leaf)",seasonal:"var(--maroon)",faith:"#5a4a86",observance:"#8a7a5c"}[c]; }

function FestivalModal({fest,lang,t,onClose}){
  const ref=useRef();
  useEffect(()=>{ const h=e=>{ if(e.key==="Escape") onClose(); }; document.addEventListener("keydown",h);
    if(ref.current) ref.current.focus(); return ()=>document.removeEventListener("keydown",h); },[]);
  if(!fest) return null;
  const dt=parseISO(fest.date); const od=odiaDate(dt);
  const gdate=`${num(dt.getDate(),lang)} ${(lang==="or"?GMON_OR:GMON_EN)[dt.getMonth()]} ${num(2027,lang)}`;
  return (
  <div className="modal-bg" onClick={onClose} role="dialog" aria-modal="true" aria-label={fest[lang]}>
    <div className="modal" onClick={e=>e.stopPropagation()} ref={ref} tabIndex={-1}>
      <div className="modal-head">
        <button className="close" onClick={onClose} aria-label="Close">✕</button>
        <div className="modal-emoji" aria-hidden="true">{fest.ic}</div>
        <h2 className={lang==="or"?"lang-or":""}>{fest[lang]}</h2>
        <div className="alt">{lang==="or"?fest.en:fest.or}</div>
        <div className="modal-meta">
          <div className="meta-box"><div className="k">{t.gregorian}</div><div className="v">{gdate}</div></div>
          {od && <div className="meta-box"><div className="k">{t.odiaDate}</div><div className="v od">{od.month[lang]} {num(od.day,lang)} · {t.sala} {num(od.sala,lang)}</div></div>}
          <div className="meta-box"><div className="k">{t.weekday}</div><div className="v">{(lang==="or"?WEEKFULL_OR:WEEKFULL_EN)[dt.getDay()]}</div></div>
        </div>
        <div style={{marginTop:"8px",display:"flex",gap:"6px",flexWrap:"wrap"}}>
          <span className="tag cat" style={{background:leftColor(fest.cat)}}>{CATS[fest.cat][lang]}</span>
          {fest.hol && <span className="tag holiday">{t.holiday}</span>}
        </div>
      </div>
      <div className="modal-body">
        <h4>{t.significance}</h4>
        <p className={lang==="or"?"lang-or":""}>{lang==="or"?fest.sigOr:fest.sigEn}</p>
        <h4>{t.traditions}</h4>
        <p className={lang==="or"?"lang-or":""}>{lang==="or"?fest.trOr:fest.trEn}</p>
      </div>
    </div>
  </div>);
}

function Footer({lang}){
  return (
  <footer className="foot">
    <div className="konark"><KonarkWheel size={40} spin={false}/></div>
    <p style={{textAlign:"center"}}>{lang==="or"
      ? "ଓଡ଼ିଆ କ୍ୟାଲେଣ୍ଡର ୨୦୨୭ — ଗ୍ରେଗୋରୀୟ ଓ ଓଡ଼ିଆ ପାଞ୍ଜି ତାରିଖ ସହ ଓଡ଼ିଶାର ପର୍ବ ଓ ଛୁଟି।"
      : "Odia Calendar 2027 — Odisha festivals & public holidays with Gregorian and Odia Panji dates."}</p>
    <p style={{textAlign:"center",fontSize:".78rem",opacity:.8}}>{lang==="or"
      ? "ଚନ୍ଦ୍ର ଓ ଇସଲାମୀ ପର୍ବର ତାରିଖ ସ୍ଥାନୀୟ ପାଞ୍ଜି / ଚନ୍ଦ୍ର ଦର୍ଶନ ଅନୁସାରେ ± ୧ ଦିନ ବଦଳି ପାରେ।"
      : "Lunar and Islamic festival dates may vary by ±1 day with local panji or moon sighting. Verify state holidays with the official Odisha gazette."}</p>
  </footer>);
}

/* ============================================================
   7.  PDF EXPORT (jsPDF) — English festival list
   ============================================================ */
function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"a4"});
  const W=doc.internal.pageSize.getWidth(); let y=54;
  doc.setFillColor(193,39,45); doc.rect(0,0,W,72,"F");
  doc.setTextColor(255,255,255); doc.setFont("times","bold"); doc.setFontSize(22);
  doc.text("Odia Calendar 2027",40,42);
  doc.setFont("times","normal"); doc.setFontSize(11);
  doc.text("Odisha festivals & public holidays  ·  Gregorian + Odia Panji dates",40,60);
  y=96; doc.setTextColor(30,20,15);
  const line=(dt,name,od,tag)=>{
    if(y>790){ doc.addPage(); y=54; }
    const o=parseISO(dt); const wd=WEEK_EN[o.getDay()];
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(193,39,45);
    doc.text(`${pad(o.getDate())} ${GMON_SHORT[o.getMonth()]}`,40,y);
    doc.setTextColor(120,110,95); doc.setFont("helvetica","normal"); doc.setFontSize(8);
    doc.text(wd,40,y+11);
    doc.setTextColor(30,20,15); doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.text(name,100,y);
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(110,100,85);
    doc.text(od+(tag?"   ["+tag+"]":""),100,y+11);
    doc.setDrawColor(220,205,160); doc.line(40,y+18,W-40,y+18);
    y+=26;
  };
  let curMonth=-1;
  FEST_SORTED.forEach(f=>{
    const o=parseISO(f.date);
    if(o.getMonth()!==curMonth){ curMonth=o.getMonth();
      if(y>770){ doc.addPage(); y=54; }
      y+=6; doc.setFillColor(28,42,74); doc.rect(40,y-11,W-80,18,"F");
      doc.setTextColor(255,255,255); doc.setFont("times","bold"); doc.setFontSize(11);
      doc.text(GMON_EN[curMonth]+" 2027",48,y+2); y+=22; doc.setTextColor(30,20,15);
    }
    const od=odiaDate(o);
    line(f.date, f.en, (od?od.month.en+" "+od.day+", Sala "+od.sala:"")+" · "+f.or, f.hol?"Public holiday":CATS[f.cat].en);
  });
  doc.setFontSize(8); doc.setTextColor(140,130,115);
  doc.text("Lunar & Islamic dates may vary ±1 day by local panji / moon sighting.",40,doc.internal.pageSize.getHeight()-24);
  doc.save("Odia-Calendar-2027.pdf");
}

/* ============================================================
   8.  APP
   ============================================================ */
function App(){
  const [lang,setLang]=useState(()=>store.get("oc-lang","en"));
  const [theme,setTheme]=useState(()=>store.get("oc-theme",""));
  const [view,setView]=useState("month");
  const [month,setMonth]=useState(()=> (todayObj.getFullYear()===2027? todayObj.getMonth():0));
  const [year,setYear]=useState(2027);
  const [search,setSearch]=useState("");
  const [filter,setFilter]=useState("all");
  const [fest,setFest]=useState(null);
  const t=T[lang];

  useEffect(()=>{ store.set("oc-lang",lang); document.documentElement.lang=lang; },[lang]);
  useEffect(()=>{ if(theme) document.documentElement.setAttribute("data-theme",theme); else document.documentElement.removeAttribute("data-theme"); store.set("oc-theme",theme); },[theme]);

  const toggleTheme=()=>{ const cur = theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); setTheme(cur==="dark"?"light":"dark"); };
  const jump=(m)=>{ setMonth(m); setYear(2027); setView("month"); window.scrollTo({top:0,behavior:"smooth"}); };

  return (
  <React.Fragment>
    <Masthead lang={lang} setLang={setLang} theme={theme} toggleTheme={toggleTheme} t={t}/>
    <TodayBand lang={lang} t={t} onOpen={setFest}/>
    <Toolbar view={view} setView={setView} lang={lang} month={month} setMonth={setMonth} year={year} setYear={setYear}
      search={search} setSearch={setSearch} t={t} onPrint={()=>window.print()} onPdf={exportPDF}/>
    <main className="wrap">
      {view==="month" && (
        <React.Fragment>
          <div className="sec-head"><h2>{(lang==="or"?GMON_OR:GMON_EN)[month]} {num(year,lang)}</h2><span className="rule"></span></div>
          <MonthView month={month} year={year} lang={lang} t={t} onOpen={setFest}/>
        </React.Fragment>)}
      {view==="year" && <YearView lang={lang} onOpen={setFest} onJump={jump}/>}
      {view==="festival" && <FestivalView lang={lang} t={t} search={search} filter={filter} setFilter={setFilter} onOpen={setFest}/>}
      <Footer lang={lang}/>
    </main>
    {fest && <FestivalModal fest={fest} lang={lang} t={t} onClose={()=>setFest(null)}/>}
  </React.Fragment>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
